name: Experiments
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  experiments:
    name: Run experiments
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - name: Cancel ongoing runs for previous commits
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate environment
        run: julia --project=explore -e 'using Pkg; Pkg.instantiate()'
      - name: Run experiments
        run: |
          julia --project=explore explore/attraction_field/run.jl
          julia --project=explore explore/beetle_trajectories/run.jl
          julia --project=explore explore/attraction_half_distance/run.jl
      - name: Build web page
        run: julia --project=explore explore/make.jl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explore/site
      - name: Upload web page preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: explore/site
  deploy:
    name: Deploy web page
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: experiments
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
