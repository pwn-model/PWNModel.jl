seed: 1
tps: 30
fps: 30

resources:
  - type: WorldSize
    width: 4000
    height: 3000
    cell_size: 10
    grid_cell_size: 500

systems:
  # Initialization
  - type: InitGrids
  
  - type: InitTrees
    cell_probability: 0.6
    tree_probability: 0.9
    damage_prevalence: 0.03
    beetle_prevalence: 0.2

  # Systems
  - type: UpdateTime
    ticks_per_year: 52

  - type: DiseaseCourse
    ticks_to_damage: 8

  - type: RandomRelease
    tick_of_infection: 0
    num_trees: 10
    cell_x: 3
    cell_y: 3

  - type: DamageTrees
    tick_of_year: 35
    damage_probability: 0.01
    removal_probability: 0.333

  - type: BeetleEmergence
    tick_of_year: 19
    beetles_per_tree: 5
    life_expectancy: 5.0

  - type: TreeAttraction
    tick_of_year: 18
    damaged_trees: true
    half_distance: 50.0
    density_radius: 20
    density_weight: 1.0

  - type: TreeAttraction
    tick_of_year: 18
    damaged_trees: false
    half_distance: 50.0
    density_radius: 20
    density_weight: 1.0

  - type: BeetleMovement
    steps_per_tick: 7
    duration_feeding: 6
    duration_egg_laying: 6
    leave_tree_probability: 0.1
    random_walk_probability: 0.5

  - type: BeetleMortality

  - type: Colonization
    tick_of_year: 20
    cell_size: 100
    kernel_half_distance: 50.0
    kernel_radius: 30
    beetles_per_tree: 2.2
    trees_per_beetle: 1.0

  - type: NematodeInfection
    infection_probability: 0.01

  # Stop criterion
  - type: FixedTermination
    steps: 5200

  # Reporters and plots
  - type: CSV
    observer:
      type: TreePopulationObserver
    file: out/tree_pop.csv

  - type: Main.Monitor
    sample_interval: 0.333

  - type: Main.TimeSeries
    observer:
      type: TreeColonizationObserver
    title: Tree colonization
    xlabel: Tick
    ylabel: Proportion

  - type: Main.TreesMap
    title: Trees

  - type: Main.Image
    title: Colonized trees
    observer:
      type: TreeColonizationMapObserver
      cell_size: 100
    colormap: viridis
    colorrange: [0.0, 5.0]

  - type: Main.Image
    title: Beetles
    observer:
      type: BeetlesMapObserver
      cell_size: 10
    colormap: viridis
    colorrange: [0.0, 10.0]

  - type: Main.Image
    title: Attraction
    observer:
      type: TreeAttractionMapObserver
      damaged_trees: false
    colormap: viridis
    colorrange: [-8.0, 0.0]
